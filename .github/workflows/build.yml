name: build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: linux-${{ matrix.kernel }} ${{ matrix.arch }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # Oldest supported mac80211 and the current stable release
        kernel: ['6.18', '7.3']
        arch: [x86_64, arm]
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison flex libelf-dev libssl-dev clang lld llvm

      # The sparse release Ubuntu ships is too old for current kernels,
      # which then skip the check with only a make warning.
      - name: Build sparse
        run: |
          git clone --depth 1 https://git.kernel.org/pub/scm/devel/sparse/sparse.git "$RUNNER_TEMP/sparse"
          make -C "$RUNNER_TEMP/sparse" -j"$(nproc)" HAVE_GTK=no HAVE_LLVM=no HAVE_LIBXML=no \
            PREFIX="$HOME/.local" install
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          sparse --version

      - name: Cache kernel build
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/ci/build-${{ matrix.kernel }}-${{ matrix.arch }}
          key: kbuild-${{ matrix.kernel }}-${{ matrix.arch }}-${{ hashFiles('.github/ci-build.sh') }}

      - name: Build with W=1 and sparse
        run: .github/ci-build.sh ${{ matrix.kernel }} ${{ matrix.arch }} ${{ runner.temp }}/ci
